<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folkefiguur Party</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #000;
    font-family: "Comic Sans MS", "Comic Neue", cursive;
    cursor: pointer;
    user-select: none;
  }

  /* slides */
  .scene {
    position: fixed; inset: 0; overflow: hidden;
    transition: transform .8s cubic-bezier(.7, 0, .3, 1);
  }

  /* ---------- disco party ---------- */
  .disco { animation: strobe 4s linear infinite; }
  @keyframes strobe {
    0%   { background: #2a0033; }
    25%  { background: #001a33; }
    50%  { background: #33001a; }
    75%  { background: #002b1a; }
    100% { background: #2a0033; }
  }
  .beams {
    position: absolute; inset: -50%;
    background: repeating-conic-gradient(from 0deg,
      rgba(255,0,200,.18) 0deg 10deg, transparent 10deg 30deg,
      rgba(0,255,255,.15) 30deg 40deg, transparent 40deg 60deg,
      rgba(255,255,0,.15) 60deg 70deg, transparent 70deg 90deg);
    animation: spin 12s linear infinite;
    pointer-events: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .ball {
    position: absolute; top: -10px; left: 50%;
    width: 110px; height: 110px; margin-left: -55px; border-radius: 50%;
    background:
      repeating-linear-gradient(0deg, transparent 0 9px, rgba(0,0,0,.35) 9px 11px),
      repeating-linear-gradient(90deg, transparent 0 9px, rgba(0,0,0,.35) 9px 11px),
      radial-gradient(circle at 35% 35%, #fff, #bbb 40%, #555 80%);
    box-shadow: 0 0 40px #fff, 0 0 90px #f0f;
    animation: ballspin 3s linear infinite, swing 2s ease-in-out infinite alternate;
    z-index: 5;
  }
  .ball::before {
    content: ""; position: absolute; left: 50%; top: -100vh; width: 2px; height: 100vh; background: #999;
  }
  @keyframes ballspin { to { filter: hue-rotate(360deg); } }
  @keyframes swing { from { transform: rotate(-6deg); } to { transform: rotate(6deg); } }

  .stage {
    position: absolute; inset: 0;
    display: flex; align-items: flex-end; justify-content: center;
    pointer-events: none; z-index: 5;
  }
  .dancer {
    height: 82vh; max-width: 90vw; object-fit: contain;
    transform-origin: bottom center;
    animation: dance .5s ease-in-out infinite alternate, glow 1.5s linear infinite;
  }
  @keyframes dance {
    0%   { transform: rotate(-7deg) translateY(0) scaleY(1); }
    50%  { transform: rotate(0deg) translateY(-30px) scaleY(1.03); }
    100% { transform: rotate(7deg) translateY(0) scaleY(.97); }
  }
  @keyframes glow {
    0%   { filter: drop-shadow(0 0 20px #f0f); }
    33%  { filter: drop-shadow(0 0 20px #0ff); }
    66%  { filter: drop-shadow(0 0 20px #ff0); }
    100% { filter: drop-shadow(0 0 20px #f0f); }
  }
  .disco.synced .dancer { animation: glow 1.5s linear infinite; }
  .disco.synced .backup { animation: none; }
  .disco.synced.hype .dancer { animation-duration: .6s; }
  .disco.hype .beams { animation-duration: 5s; }
  .backup {
    position: absolute; bottom: 0; height: 40vh; opacity: .55;
    transform-origin: bottom center;
    animation: dance .5s ease-in-out infinite alternate-reverse;
    filter: hue-rotate(160deg) saturate(2);
    pointer-events: none; z-index: 2;
  }
  .backup.left  { left: 4vw; }
  .backup.right { right: 4vw; filter: hue-rotate(260deg) saturate(2); transform: scaleX(-1); animation-name: dance-flip; }
  @keyframes dance-flip {
    0%   { transform: scaleX(-1) rotate(-7deg) translateY(0); }
    50%  { transform: scaleX(-1) rotate(0deg) translateY(-20px); }
    100% { transform: scaleX(-1) rotate(7deg) translateY(0); }
  }

  h1 {
    position: absolute; top: 120px; width: 100%; text-align: center;
    font-size: clamp(2rem, 8vw, 5.5rem); color: #fff;
    text-shadow: 3px 3px 0 #f0f, -3px -3px 0 #0ff;
    animation: wobble 1s ease-in-out infinite, rainbow 2s linear infinite;
    pointer-events: none; z-index: 1;
  }
  @keyframes wobble {
    0%, 100% { transform: rotate(-3deg) scale(1); }
    50%      { transform: rotate(3deg) scale(1.1); }
  }
  @keyframes rainbow { to { filter: hue-rotate(360deg); } }

  .confetti {
    position: absolute; top: -20px; width: 10px; height: 16px; z-index: 4;
    pointer-events: none; animation: fall linear forwards;
  }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

  .balloon {
    position: absolute; bottom: -160px; z-index: 4;
    width: calc(60px * var(--s)); height: calc(76px * var(--s));
    border-radius: 50% 50% 48% 48% / 55% 55% 45% 45%;
    background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.75) 0 8%, transparent 22%), var(--c);
    box-shadow: inset -8px -10px 18px rgba(0,0,0,.25);
    pointer-events: none; animation: rise var(--t) linear forwards;
  }
  .balloon::before {
    content: ""; position: absolute; left: 50%; bottom: -7px; margin-left: -6px;
    border: 6px solid transparent; border-bottom: 8px solid var(--c); border-top: 0;
    transform: rotate(180deg);
  }
  .balloon::after {
    content: ""; position: absolute; left: 50%; top: 100%; margin-top: 6px;
    width: 2px; height: calc(80px * var(--s));
    background: rgba(255,255,255,.6); transform-origin: top; animation: string 1s ease-in-out infinite alternate;
  }
  @keyframes rise {
    0%   { transform: translate(0, 0) rotate(-6deg); }
    25%  { transform: translate(25px, -30vh) rotate(6deg); }
    50%  { transform: translate(-20px, -60vh) rotate(-6deg); }
    75%  { transform: translate(20px, -90vh) rotate(6deg); }
    100% { transform: translate(0, -125vh) rotate(-6deg); }
  }
  @keyframes string { from { transform: rotate(-10deg); } to { transform: rotate(10deg); } }

  .pop {
    position: absolute; width: 12px; height: 12px; border-radius: 50%; z-index: 7;
    pointer-events: none; animation: burst .9s ease-out forwards;
  }
  @keyframes burst { to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }

  /* ---------- halloween party ---------- */
  .halloween {
    background: radial-gradient(ellipse at 50% 110%, #5a1e00 0%, #2b0a3d 45%, #0b0414 100%);
  }
  .moon {
    position: absolute; top: 6vh; right: 9vw; width: 150px; height: 150px; border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #fffbe0, #f5e199 60%, #d9bd5c);
    box-shadow: 0 0 60px #ffe9a0, 0 0 160px rgba(255,200,80,.5);
    animation: moonglow 4s ease-in-out infinite alternate;
  }
  .moon::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background:
      radial-gradient(circle at 30% 60%, rgba(180,150,60,.35) 0 10%, transparent 11%),
      radial-gradient(circle at 65% 35%, rgba(180,150,60,.3) 0 8%, transparent 9%),
      radial-gradient(circle at 60% 72%, rgba(180,150,60,.25) 0 6%, transparent 7%);
  }
  @keyframes moonglow { to { box-shadow: 0 0 90px #ffe9a0, 0 0 220px rgba(255,170,60,.6); } }
  .spooky-beams {
    position: absolute; inset: -50%;
    background: repeating-conic-gradient(from 0deg,
      rgba(255,110,0,.14) 0deg 8deg, transparent 8deg 36deg,
      rgba(150,0,255,.14) 36deg 44deg, transparent 44deg 72deg,
      rgba(80,255,80,.08) 72deg 78deg, transparent 78deg 90deg);
    animation: spin 18s linear infinite reverse;
    pointer-events: none;
  }
  .fog {
    position: absolute; left: -50%; bottom: 0; width: 200%; height: 35vh; z-index: 6;
    background:
      radial-gradient(ellipse at 20% 100%, rgba(220,200,255,.22), transparent 60%),
      radial-gradient(ellipse at 55% 100%, rgba(220,200,255,.18), transparent 55%),
      radial-gradient(ellipse at 85% 100%, rgba(220,200,255,.22), transparent 60%);
    animation: drift 14s ease-in-out infinite alternate;
    pointer-events: none;
  }
  @keyframes drift { to { transform: translateX(25%); } }
  .halloween h1 {
    color: #ff8a1c;
    text-shadow: 3px 3px 0 #7a00ff, -3px -3px 0 #2bff6a;
    animation: wobble 1.4s ease-in-out infinite;
  }
  .couple {
    height: 78vh; max-width: 94vw; object-fit: contain;
    transform-origin: bottom center;
    animation: sway .6s ease-in-out infinite alternate, spookyglow 2s linear infinite;
  }
  .halloween.hype .couple { animation-duration: .25s, 1s; }
  .halloween.hype .spooky-beams { animation-duration: 5s; }
  .halloween.hype h1 { animation-duration: .5s; }
  .halloween h1 { transition: scale .35s cubic-bezier(.3, 1.6, .5, 1); }
  .halloween.shout h1 { scale: 1.8; animation: shake .09s linear infinite; }
  @keyframes shake {
    0%   { transform: translate(0, 0) rotate(0deg); }
    25%  { transform: translate(-8px, 5px) rotate(-3deg); }
    50%  { transform: translate(7px, -6px) rotate(2deg); }
    75%  { transform: translate(-5px, -4px) rotate(3deg); }
    100% { transform: translate(6px, 6px) rotate(-2deg); }
  }
  .halloween.hype .spider { animation-duration: 1.2s; }
  .halloween.hype .fog { animation-duration: 5s; }
  .halloween.hype .moon { animation-duration: 1s; }
  .halloween.hype .wing { animation-duration: .08s; }
  .bass { display: flex; justify-content: center; align-items: flex-end; transform-origin: bottom center; will-change: transform; }
  @keyframes sway {
    0%   { transform: rotate(-4deg) translateY(0); }
    50%  { transform: rotate(0deg) translateY(-24px); }
    100% { transform: rotate(4deg) translateY(0); }
  }
  @keyframes spookyglow {
    0%   { filter: drop-shadow(0 0 22px #ff7a00); }
    50%  { filter: drop-shadow(0 0 22px #9a2bff); }
    100% { filter: drop-shadow(0 0 22px #ff7a00); }
  }

  .spider {
    position: absolute; top: 0; z-index: 4; pointer-events: none;
    animation: dangle 3.5s ease-in-out infinite alternate;
  }
  .spider::before {
    content: ""; position: absolute; left: 50%; bottom: 100%; width: 1px; height: 100vh; background: rgba(255,255,255,.5);
  }
  @keyframes dangle {
    from { transform: translateY(var(--from)); }
    to   { transform: translateY(var(--to)); }
  }

  .bat {
    position: absolute; z-index: 4; pointer-events: none;
    animation: fly var(--t) linear forwards;
  }
  .bat svg { display: block; filter: drop-shadow(0 0 6px rgba(255,120,0,.6)); }
  .wing { transform-box: view-box; transform-origin: 50px 24px; animation: flap .16s ease-in-out infinite alternate; }
  @keyframes flap { to { transform: scaleY(.25); } }
  @keyframes fly {
    0%   { transform: translate(0, 0); }
    25%  { transform: translate(calc(var(--dir) * 30vw), -6vh); }
    50%  { transform: translate(calc(var(--dir) * 60vw), 4vh); }
    75%  { transform: translate(calc(var(--dir) * 90vw), -8vh); }
    100% { transform: translate(calc(var(--dir) * 125vw), 0); }
  }

  .crawler {
    position: absolute; z-index: 7; pointer-events: none;
    filter: drop-shadow(0 0 4px rgba(255,120,0,.7));
    animation: scurry var(--t) cubic-bezier(.25, .7, .45, 1) forwards;
  }
  @keyframes scurry {
    0%   { transform: translate(0, 0) rotate(var(--rot)) scale(.3); opacity: 1; }
    12%  { transform: translate(calc(var(--dx) * .08), calc(var(--dy) * .08)) rotate(var(--rot)) scale(1); }
    40%  { transform: translate(calc(var(--dx) * .45 + var(--wob)), calc(var(--dy) * .45)) rotate(calc(var(--rot) + 12deg)) scale(1); }
    70%  { transform: translate(calc(var(--dx) * .75 - var(--wob)), calc(var(--dy) * .75)) rotate(calc(var(--rot) - 10deg)) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(1); opacity: 0; }
  }
  .legs { transform-box: fill-box; transform-origin: center; animation: wiggle .07s linear infinite alternate; }
  @keyframes wiggle { to { transform: scaleX(.82) skewY(7deg); } }
  .pumpkin {
    position: absolute; bottom: -120px; z-index: 4; pointer-events: none;
    width: calc(70px * var(--s));
    filter: drop-shadow(0 0 14px rgba(255,140,0,.8));
    animation: rise var(--t) linear forwards;
  }

  .credits {
    position: absolute; right: 16px; bottom: 14px; z-index: 8;
    display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
  }
  .credits a {
    color: #ffb15c; font-size: 15px; text-decoration: none;
    text-shadow: 0 0 6px #000, 0 0 12px #000; cursor: pointer;
  }
  .credits a:hover { color: #fff; text-decoration: underline; }
  @media (max-width: 600px) { .credits { bottom: 64px; } .credits a { font-size: 13px; } }

  /* ---------- spooky birthday party ---------- */
  .bday { background: radial-gradient(ellipse at 50% 115%, #1f4d12 0%, #2a0f45 45%, #08030f 100%); }
  .bday .moon { left: 7vw; right: auto; top: 12vh; width: 110px; height: 110px; }
  .bday h1 {
    top: 90px; line-height: 1; color: #9dff3c;
    text-shadow: 4px 4px 0 #6a00c9, -2px -2px 0 #ff7a00;
    animation: wobble 1.3s ease-in-out infinite;
  }
  .bunting {
    position: absolute; top: 0; left: -2%; width: 104%; height: 70px; z-index: 6; display: flex;
    justify-content: space-between; pointer-events: none;
    background: radial-gradient(ellipse at 50% -60%, transparent 70%, rgba(255,255,255,.5) 70.5%, transparent 71.5%);
  }
  .bunting span {
    width: 0; height: 0; border-left: 18px solid transparent; border-right: 18px solid transparent;
    border-top: 34px solid var(--c); margin-top: var(--y); transform-origin: top center;
    animation: flutter 1.8s ease-in-out infinite alternate; animation-delay: var(--d);
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.5));
  }
  @keyframes flutter { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }
  .duo {
    height: 78vh; max-width: 96vw; object-fit: contain; transform-origin: bottom center;
    animation: sway .55s ease-in-out infinite alternate, bdayglow 2.4s linear infinite;
  }
  .bday.synced .duo { animation: bdayglow 2.4s linear infinite; }
  @keyframes bdayglow {
    0%   { filter: drop-shadow(0 0 20px #9dff3c); }
    50%  { filter: drop-shadow(0 0 20px #b04bff); }
    100% { filter: drop-shadow(0 0 20px #9dff3c); }
  }
  .cake { position: absolute; right: 3vw; bottom: 2vh; width: min(20vw, 190px); z-index: 6; pointer-events: none; }
  .flame { transform-box: fill-box; transform-origin: bottom center; animation: flick .18s ease-in-out infinite alternate;
    scale: var(--flare, 1); transition: opacity .25s, scale .12s; }
  .cake.out .flame { opacity: 0; }
  .smoke {
    position: absolute; width: 14px; height: 14px; border-radius: 50%; background: rgba(210,210,230,.7);
    pointer-events: none; animation: smoke 1.8s ease-out forwards;
  }
  @keyframes smoke { to { transform: translate(var(--dx), -90px) scale(3.5); opacity: 0; } }
  .bday h1 .ch { display: inline-block; }
  .dim { position: absolute; inset: 0; z-index: 2; background: #000; opacity: 0; pointer-events: none; }
  .boss {
    position: absolute; left: 50%; bottom: 8vh; width: min(70vh, 80vw); z-index: 3; pointer-events: none;
    opacity: 0; filter: drop-shadow(0 0 40px rgba(180,120,255,.8));
  }
  .burstghost {
    position: absolute; left: 50%; top: 52%; z-index: 7; pointer-events: none; width: 60px; margin: -40px 0 0 -30px;
    animation: ghostout 1.4s cubic-bezier(.2, .7, .4, 1) forwards;
  }
  @keyframes ghostout {
    0%   { transform: translate(0, 0) scale(.2) rotate(0deg); opacity: 0; }
    15%  { opacity: .95; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.3) rotate(var(--spin)); opacity: 0; }
  }
  @keyframes flick { from { transform: scale(1, 1) rotate(-4deg); } to { transform: scale(.85, 1.15) rotate(4deg); } }
  .ghost {
    position: absolute; bottom: -140px; z-index: 4; pointer-events: none; opacity: .85;
    width: calc(70px * var(--s)); animation: rise var(--t) linear forwards;
  }
  .ghost svg { display: block; animation: ghostwave 1.2s ease-in-out infinite alternate; }
  @keyframes ghostwave { from { transform: translateX(-12px) rotate(-6deg); } to { transform: translateX(12px) rotate(6deg); } }
  .balloon .eyes { position: absolute; inset: 0; }
  .candy {
    position: absolute; z-index: 7; width: 18px; pointer-events: none;
    animation: candypop var(--t) cubic-bezier(.2, .7, .4, 1) forwards;
  }
  @keyframes candypop {
    0%   { transform: translate(0, 0) rotate(0deg) scale(.4); opacity: 1; }
    70%  { opacity: 1; }
    100% { transform: translate(var(--dx), calc(var(--dy) + 120px)) rotate(var(--spin)) scale(1); opacity: 0; }
  }
  @media (max-width: 600px) { .bday h1 { top: 70px; } .cake { width: 24vw; } }

  /* ---------- controls ---------- */
  body.paused *, body.paused *::before, body.paused *::after { animation-play-state: paused !important; }
  .controls { position: fixed; top: 14px; right: 14px; z-index: 20; display: flex; gap: 8px; }
  .controls button {
    padding: 8px 16px; border-radius: 999px; border: 2px solid #fff;
    background: rgba(0,0,0,.4); color: #fff; font: inherit; font-size: 16px; cursor: pointer;
  }
  .nav {
    position: fixed; top: 50%; z-index: 20; transform: translateY(-50%);
    width: 56px; height: 56px; border-radius: 50%; border: 2px solid #fff;
    background: rgba(0,0,0,.4); color: #fff; font: inherit; font-size: 34px; line-height: 1;
    cursor: pointer; transition: background .2s, transform .2s;
  }
  .nav:hover { background: rgba(255,255,255,.25); transform: translateY(-50%) scale(1.1); }
  .nav.prev { left: 14px; }
  .nav.next { right: 14px; }
  .dots {
    position: fixed; bottom: 40px; left: 0; right: 0; z-index: 20;
    display: flex; justify-content: center; gap: 10px; pointer-events: none;
  }
  .dots span { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,.35); transition: background .3s, transform .3s; }
  .dots span.on { background: #fff; transform: scale(1.3); }
  .clock {
    position: fixed; left: 14px; bottom: 14px; z-index: 20; padding: 6px 12px; border-radius: 8px;
    background: rgba(0,0,0,.6); color: #fff; font: 600 20px/1 ui-monospace, monospace; pointer-events: none;
  }
  .hint {
    position: fixed; bottom: 12px; left: 0; right: 0; text-align: center;
    color: #fff; opacity: .7; font-size: 14px; z-index: 20; pointer-events: none;
  }

  @media (max-width: 600px) {
    .nav { width: 44px; height: 44px; font-size: 26px; }
    .moon { width: 90px; height: 90px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation-duration: 6s !important; }
  }
</style>
</head>
<body>
  <section class="scene bday" data-music="birthday.aac">
    <div class="spooky-beams"></div>
    <div class="moon"></div>
    <div class="bunting"></div>
    <h1>JELLE’S SPOOKY<br>BIRTHDAY PARTY</h1>
    <div class="stage">
      <img class="duo" src="jelle.png" alt="Two friends dancing in black tracksuits">
    </div>
    <div class="dim"></div>
    <div class="boss"></div>
    <div class="cake"></div>
    <div class="fog"></div>
  </section>

  <section class="scene halloween" data-music="halloween.aac">
    <div class="spooky-beams"></div>
    <div class="moon"></div>
    <h1>SPOOKY PARTY</h1>
    <div class="stage">
      <div class="bass"><img class="couple" src="sophie-folke.png" alt="Sophie and Folke dancing with their cats"></div>
    </div>
    <div class="fog"></div>
    <div class="credits">
      <a href="https://soundcloud.com/audiotist" target="_blank" rel="noopener">music: Audiotist</a>
      <a href="https://www.instagram.com/aaikecamerlynck/" target="_blank" rel="noopener">art: Aaike Camerlynck</a>
    </div>
  </section>

  <section class="scene disco" data-music="party.mp3">
    <div class="beams"></div>
    <div class="ball"></div>
    <h1>PARTY TIME</h1>
    <img class="backup left" src="folkefiguur.png" alt="">
    <img class="backup right" src="folkefiguur.png" alt="">
    <div class="stage">
      <img class="dancer" src="folkefiguur.png" alt="Folkefiguur dancing">
    </div>
  </section>

  <button class="nav prev" aria-label="Previous party">‹</button>
  <button class="nav next" aria-label="Next party">›</button>
  <div class="dots"></div>
  <div class="hint">click anywhere to start the music</div>
  <div class="clock" hidden></div>
  <div class="controls">
    <button class="pause">pause</button>
    <button class="mute">mute</button>
  </div>
  <audio id="music" preload="auto" loop></audio>

<script>
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const rand = (min, max) => min + Math.random() * (max - min);
  const scenes = [...document.querySelectorAll(".scene")];
  const dots = document.querySelector(".dots");
  const music = document.getElementById("music");
  const muteBtn = document.querySelector(".mute");
  const hint = document.querySelector(".hint");
  let current = 0;
  let started = false;
  let paused = false;

  const PALETTES = {
    bday: ["#9dff3c", "#b04bff", "#ff7a00", "#ffd23f", "#ff4ecd", "#1a1a1a"],
    disco: ["#ff00c8", "#00f0ff", "#ffe600", "#39ff14", "#ff6a00", "#ffffff"],
    halloween: ["#ff7a00", "#9a2bff", "#39ff14", "#ffb000", "#1a1a1a"],
  };
  const sceneName = () => ["bday", "halloween", "disco"].find(n => scenes[current].classList.contains(n));
  const here = el => { scenes[current].appendChild(el); return el; };
  const removeWhenDone = (el, name) => el.addEventListener("animationend", e => {
    if (!name || e.animationName === name) el.remove();
  });

  /* shared */
  function confetti() {
    const c = here(document.createElement("div"));
    c.className = "confetti";

ptvqxsxuqsvtvtxvqqvuovwvrpvvkxvwrpuviytwspuulxsxtptupxrxtpsvsvswuqruupvwvrquvlxwwrpuuiytwsptvlzswtptvpzrxtqsvsttxupqutpuwvqpuulwvvrpuuiyuwspuvlztxsptvpysxtpsvswswuqrvurtwurqvu91000000000553019lqvzzxzpztzvruwtyuyvqswusuxwrqvvmxwwsqvvjzvxtquvkzuxtpuvozsxuqtvsxsxuqrvutuxvrrvvnxxwrpvvjyvwspuvkztwspuvnzsxuqtvrytxuqrvtttxvqqvuowwvrpvvjyvwspuvjzuxsptvnzsxtptvqysxuqrvtutxvrruupwxwqpvukyvwrpuujztwspuvmzsxtqtvqzsxupsvtutwuqqvupvwvkxjxiywvqpvvg10000000000000000000000000000000000000000000";
  const BDAY_BASS_UP = [55, 70], BDAY_BASS_FORWARD = [71, 85];
  let bdayBass = 0;
  /* lyric moves, snapped to beats: "face down" then "ass up", at clock 2:15 and again 4 bars later at 2:21.6 */
  const LYRIC_MOVES = [[133.01, 134.23, 135.05, 137.09], [139.54, 140.76, 141.58, 143.62]];
  const envelope = (t, [a, b], fadeIn = 0.15, fadeOut = 0.2) =>
    t < a || t > b + fadeOut ? 0 : t < a + fadeIn ? (t - a) / fadeIn : t > b ? 1 - (t - b) / fadeOut : 1;
  const bdayScene = document.querySelector(".bday");
  const duo = bdayScene.querySelector(".duo");
  const cakeEl = document.querySelector(".cake");
  const dimEl = document.querySelector(".dim");
  const bossEl = document.querySelector(".boss");
  const titleChars = () => document.querySelectorAll(".bday h1 .ch");
  let flareUntil = 0;

  function ghostBurst() {
    for (let i = 0; i < 12; i++) {
      const g = here(document.createElement("div"));
      const angle = (i / 12) * Math.PI * 2 + rand(-.2, .2), dist = rand(380, 620);
      g.className = "burstghost";
      g.innerHTML = GHOST_SVG;
      g.style.setProperty("--hat", pick(["#ff7a00", "#b04bff", "#9dff3c", "#ff4ecd"]));
      g.style.setProperty("--dx", Math.cos(angle) * dist + "px");
      g.style.setProperty("--dy", Math.sin(angle) * dist * .7 + "px");
      g.style.setProperty("--spin", rand(-40, 40) + "deg");
      removeWhenDone(g, "ghostout");
    }
  }
  function puffSmoke() {
    [26, 50, 74].forEach(x => {
      const p = document.createElement("div");
      p.className = "smoke";
      p.style.left = `calc(${x}% - 7px)`;
      p.style.top = x === 50 ? "2%" : "8%";
      p.style.setProperty("--dx", rand(-20, 20) + "px");
      cakeEl.appendChild(p);
      removeWhenDone(p, "smoke");
    });
  }
  function popBalloons() {
    const scene = document.querySelector(".bday");
    const visible = [...scene.querySelectorAll(".balloon")].filter(b => {
      const r = b.getBoundingClientRect(); return r.bottom > 0 && r.top < innerHeight;
    }).slice(0, 3);
    visible.forEach(b => {
      const r = b.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
      b.remove();
      for (let i = 0; i < 24; i++) {
        const c = here(document.createElement("div"));
        const angle = rand(0, Math.PI * 2), dist = rand(40, 160);
        c.className = "pop";
        c.style.left = x + "px"; c.style.top = y + "px";
        c.style.background = pick(PALETTES.bday);
        c.style.setProperty("--dx", Math.cos(angle) * dist + "px");
        c.style.setProperty("--dy", Math.sin(angle) * dist + "px");
        removeWhenDone(c, "burst");
      }
    });
  }

  function followBday() {
    requestAnimationFrame(followBday);
    if (paused) return;
    const on = music.src.endsWith("birthday.aac") && !music.paused;
    bdayScene.classList.toggle("synced", on);
    if (!on) {
      duo.style.transform = "";
      titleChars().forEach(c => c.style.transform = "");
      dimEl.style.opacity = 0; bossEl.style.opacity = 0; cakeEl.classList.remove("out");
      return;
    }
    const t = music.currentTime;
    const beats = (t - BDAY_BAR0) / BDAY_BEAT;
    const k = Math.floor(beats), f = beats - k;
    const bar = Math.floor(beats / 4);
    const calm = BDAY_CALM.some(([a, b]) => bar >= a && bar <= b);
    const hold = BDAY_BREAKS.includes(bar);
    let hopF = f, height = 30, tilt = 7, side = k % 2 ? 1 : -1;
    if (calm) { hopF = (((k % 2) + 2) % 2 + f) / 2; height = 18; tilt = 5; side = Math.floor(k / 2) % 2 ? 1 : -1; }
    if (hold) { height = 4; tilt = 2; }
    const lift = Math.sin(Math.PI * hopF);
    const squash = Math.max(0, 1 - hopF / 0.15) * (hold ? 0 : 0.05);
    const rot = side * tilt * Math.sin(Math.PI * f);
    const want = parseInt(BDAY_BASS[Math.floor(t / 0.05)] || "0", 36) / 35;
    bdayBass = want > bdayBass ? want : bdayBass * 0.88;
    const up = bar >= BDAY_BASS_UP[0] && bar <= BDAY_BASS_UP[1] ? bdayBass * 34 : 0;
    const forward = bar >= BDAY_BASS_FORWARD[0] && bar <= BDAY_BASS_FORWARD[1] ? 1 + bdayBass * 0.12 : 1;
    // mirror on every slam after a break, with a quick turn
    const done = BDAY_FLIPS.filter(ft => t >= ft);
    const facing = done.length % 2 ? -1 : 1;
    const since = done.length ? t - done[done.length - 1] : 99;
    const sx = since < 0.3 ? -facing * Math.cos(Math.PI * since / 0.3) : facing;
    const down = Math.max(...LYRIC_MOVES.map(([a, b]) => envelope(t, [a, b])));
    const ass = Math.max(...LYRIC_MOVES.map(([, , a, b]) => envelope(t, [a, b], 0.1, 0.25)));
    const popAt = LYRIC_MOVES.map(m => m[2]).find(a => t >= a && t < a + 0.6);
    const pop = popAt !== undefined ? Math.sin(Math.PI * (t - popAt) / 0.6) * 70 : 0;
    const twerk = ass ? Math.abs(Math.sin(Math.PI * 2 * f)) * 16 * ass : 0;
    const bow = facing * (24 * down + 16 * ass);
    const dip = 30 * down - pop - twerk;
    const squat = 1 - 0.1 * down;
    duo.style.transform = `translateY(${-lift * height * (1 - down) - up + dip}px) rotate(${rot * (1 - down) + bow}deg) scale(${sx * (1 + squash * 0.6) * forward}, ${(1 - squash) * forward * squat})`;

    // title letters hop one after the other on each beat
    const waveH = hold ? 3 : calm ? 7 : 13;
    titleChars().forEach((c, i) => {
      const lf = (((beats - i * 0.06) % 1) + 1) % 1;
      c.style.transform = lf < 0.5 ? `translateY(${-Math.sin(Math.PI * lf * 2) * waveH}px)` : "";
    });

    // ghosts burst out and candles flare on every slam; balloons pop on every break
    if (crossed(BDAY_SLAMS, bdayPrevT, t)) { ghostBurst(); flareUntil = t + 0.45; }
    if (crossed(BDAY_BREAK_TIMES, bdayPrevT, t)) popBalloons();
    if (crossed([BREAKDOWN[0]], bdayPrevT, t)) puffSmoke();
    const inBreakdown = t >= BREAKDOWN[0] && t < BREAKDOWN[1];
    cakeEl.classList.toggle("out", inBreakdown);
    cakeEl.style.setProperty("--flare", t < flareUntil ? 1.9 : 1);

    // breakdown: lights dim and a giant ghost rises behind them, gone on the slam
    let boss = 0, bossRise = 0;
    if (inBreakdown) {
      const p = (t - BREAKDOWN[0]) / (BREAKDOWN[1] - BREAKDOWN[0]);
      boss = Math.min(1, p / 0.25);
      bossRise = Math.min(1, p / 0.35);
    }
    const afterSlam = t - BREAKDOWN[1];
    const vanish = afterSlam >= 0 && afterSlam < 0.35 ? 1 - afterSlam / 0.35 : 0;

    bossEl.style.opacity = Math.max(boss * 0.85, vanish * 0.85);
    const bob = Math.sin(t * 2.2) * 3;
    bossEl.style.transform = `translate(-50%, ${(1 - bossRise) * 60 - bob}%) scale(${1 + vanish * 0.6 * (afterSlam >= 0 ? 1 : 0)})`;
    bdayPrevT = t;
  }
  requestAnimationFrame(followBday);

  function startMusic() {
    if (started) return;
    started = true;
    music.play().then(() => { hint.textContent = "click anywhere for more party, arrows to switch"; }).catch(() => { started = false; });
  }

  const pauseBtn = document.querySelector(".pause");
  function togglePause() {
    if (!started) return startMusic();
    paused = !paused;
    document.body.classList.toggle("paused", paused);
    pauseBtn.textContent = paused ? "play" : "pause";
    if (paused) music.pause(); else music.play().catch(() => {});
  }
  pauseBtn.addEventListener("click", e => { e.stopPropagation(); togglePause(); });

  muteBtn.addEventListener("click", e => {
    e.stopPropagation();
    if (!started) return startMusic();
    music.muted = !music.muted;
    muteBtn.textContent = music.muted ? "unmute" : "mute";
  });
  document.querySelector(".prev").addEventListener("click", e => { e.stopPropagation(); startMusic(); show(current - 1); });
  document.querySelector(".next").addEventListener("click", e => { e.stopPropagation(); startMusic(); show(current + 1); });
  document.addEventListener("keydown", e => {
    if (e.key === " ") { e.preventDefault(); togglePause(); }
    if (e.key === "ArrowLeft") { startMusic(); show(current - 1); }
    if (e.key === "ArrowRight") { startMusic(); show(current + 1); }
  });
  let touchX = null;
  document.addEventListener("touchstart", e => { touchX = e.touches[0].clientX; }, { passive: true });
  document.addEventListener("touchend", e => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    touchX = null;
    if (Math.abs(dx) > 60) { startMusic(); show(current + (dx < 0 ? 1 : -1)); }
  });

  /* clicking */
  document.addEventListener("click", e => {
    if (paused || e.target.closest("a")) return;
    startMusic();
    if (sceneName() === "halloween") return spiderBurst(e.clientX, e.clientY);
    if (sceneName() === "bday") candyBurst(e.clientX, e.clientY);
    const palette = PALETTES[sceneName()];
    for (let i = 0; i < 30; i++) {
      const p = here(document.createElement("div"));
      p.className = "pop";
      p.style.left = e.clientX + "px";
      p.style.top = e.clientY + "px";
      p.style.background = pick(palette);
      const angle = Math.random() * Math.PI * 2;
      const dist = rand(80, 240);
      p.style.setProperty("--dx", Math.cos(angle) * dist + "px");
      p.style.setProperty("--dy", Math.sin(angle) * dist + "px");
      removeWhenDone(p, "burst");
    }
    if (sceneName() === "disco") for (let i = 0; i < 3; i++) balloon(e.clientX / innerWidth * 100 - 4 + (i - 1) * 4);
  });

  /* party loop */
  setInterval(() => { if (!paused && (sceneName() === "disco" || hype || Math.random() < .4)) confetti(); }, 60);
  setInterval(() => { if (!paused && sceneName() === "disco") balloon(); }, 900);
  setInterval(() => { if (!paused && sceneName() === "halloween" && (hype || Math.random() < .33)) bat(); }, 430);
  setInterval(() => { if (!paused && sceneName() === "halloween" && (hype || Math.random() < .4)) pumpkin(); }, 680);

  setInterval(() => { if (!paused && sceneName() === "bday") bdayBalloon(); }, 1100);
  setInterval(() => { if (!paused && sceneName() === "bday") ghost(); }, 1600);

  show(0);
  startMusic();
</script>
